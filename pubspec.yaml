name: wifi
description: "Pengingat service rutin"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Cloud
  cloud_firestore: ^6.4.1
  firebase_core: ^4.9.0
  riverpod_lint: ^3.1.3
  # State Management & Utils
  collection: ^1.19.1
  go_router: ^17.2.3
  intl: ^0.20.2
  rxdart: ^0.28.0

  # UI & Assets
  cupertino_icons: ^1.0.9
  google_fonts: ^8.1.0
  fl_chart: ^1.2.0
  font_awesome_flutter: ^11.0.0

  connectivity_plus: ^7.1.1
  device_info_plus: ^13.1.0
  flutter_local_notifications: ^21.0.0
  flutter_timezone: ^5.1.0
  package_info_plus: ^10.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  google_mobile_ads: ^8.0.0
  meta: ^1.18.0

  # Local Database
  sqflite: ^2.4.2+1
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.0+3

  # Other
  jiffy: ^6.4.4
  timezone: ^0.11.0
  uuid: ^4.5.3
  permission_handler: ^12.0.2
  flutter_native_splash: ^2.4.7
  toastification: ^3.2.0
  dio: ^5.9.2
  open_filex: ^4.7.0
  gma_mediation_unity: ^1.8.0
  workmanager: ^0.9.0+3
  http: ^1.6.0
  image: ^4.8.0
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  supabase_flutter: ^2.12.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.1.0
  connectivity_plus_platform_interface: ^2.1.0
  device_info_plus_platform_interface: ^8.1.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.3
  fake_cloud_firestore: ^4.1.1
  mockito: ^5.6.4

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/image/splash.png
  
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/image/splash.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/image/ikon_apk.png"

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/OpenSans-Medium.ttf
          weight: 500
